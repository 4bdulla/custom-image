name: bluebuild
on:
  schedule:
    - cron: "00 06 * * *" # daily, after the ublue images build, to pick up base updates
  push:
    branches: [main] # branches get built through their PR
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
env:
  # sysstate revision baked into the images.
  SYSSTATE_REF: main
jobs:
  bluebuild:
    name: Build ${{ matrix.recipe }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        recipe:
          - aurora.yml
          - bazzite.yml
    steps:
      - uses: actions/checkout@v4

      # sysstate is private: read it with a read-only deploy key on that repo,
      # not a token that reaches every repo of the account.
      - uses: actions/checkout@v4
        with:
          repository: 4bdulla/sysstate
          ref: ${{ env.SYSSTATE_REF }}
          ssh-key: ${{ secrets.SYSSTATE_DEPLOY_KEY }}
          path: .sysstate

      - uses: actions/setup-go@v5
        with:
          go-version-file: .sysstate/go.mod
          cache: false # sysstate has no go.sum to key a cache on

      - name: Stage sysstate
        run: .sysstate/packaging/stage.sh "$PWD/files/sysstate"

      - name: Build image
        uses: blue-build/github-action@v1.13
        with:
          recipe: ${{ matrix.recipe }}
          skip_checkout: true
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          maximize_build_space: true

      # Test level 2. Every build, PRs included, pushes a <short-sha>-<fedora>
      # tag; smoke-test exactly that image.
      - name: Smoke test
        env:
          TOKEN: ${{ github.token }}
        run: |
          host="${{ matrix.recipe }}"; host="${host%.yml}"
          ref="ghcr.io/${{ github.repository_owner }}/${host}-host"
          echo "$TOKEN" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          tag=$(skopeo list-tags "docker://$ref" | jq -r '.Tags[]' | grep "^${GITHUB_SHA::7}-" | head -1)
          test -n "$tag" || { echo "no ${GITHUB_SHA::7}-* tag on $ref"; exit 1; }
          podman run --rm -e HOST="$host" -v "$PWD":/repo:ro --entrypoint bash "$ref:$tag" /repo/tests/smoke.sh
